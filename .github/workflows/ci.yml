name: Check assets
on: [push, pull_request]

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any model is larger than 10 MB
        run: |
          big=$(find . -name "*.glb" -size +10M)
          if [ -n "$big" ]; then
            echo "These files are too large, please compress them:"
            echo "$big"
            exit 1
          fi
